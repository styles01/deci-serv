<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>deciserv plays — six games, one grid</title>
<style>
/* Multiview grid tiling 0xBakeer's showcase pages (served by games/serve_showcase.py on :8010).
   Theme tokens copied from vendor/arbiter/showcase/_lib/theme.css (arbiter showcase, MIT). */
:root {
  --bg: #0A0F1E; --surface: #0E1528; --line: #1E2842; --line-2: #2B3758; --track: #151D35;
  --ink: #E9EDF7; --muted: #8B95B3; --faint: #5E6887;
  --cobalt: #5583FF; --cobalt-text: #7DA0FF; --cobalt-dim: #2E4FA6;
  --orange: #FF8C33; --live: #3DD68C;
  --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 14px; line-height: 1.45;
  display: flex; flex-direction: column; overflow: hidden;
}

/* ---------- header row ---------- */
.top {
  flex: none; display: flex; align-items: center; gap: 14px;
  height: 52px; padding: 0 20px; border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
.wordmark { font-weight: 600; letter-spacing: -0.02em; font-size: 17px; }
.wordmark .plays { color: var(--orange); }
.sub { color: var(--muted); font-size: 13px; }
.spacer { flex: 1; }
.chip {
  display: inline-flex; align-items: center; gap: 8px;
  color: var(--muted); font-size: 12px; white-space: nowrap;
  border: 1px solid var(--line-2); border-radius: 4px; padding: 4px 10px;
}
.chip a { color: var(--cobalt-text); border: 0; }
.chip a:hover { color: var(--ink); }
.dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--live);
  box-shadow: 0 0 8px rgba(61, 214, 140, .55); flex: none;
}
.dot.pulse { animation: pulse 2s var(--ease, ease) infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }

/* ---------- 2x3 grid ---------- */
.grid {
  flex: 1; min-height: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr 1fr;
  gap: 10px; padding: 10px;
}
.panel {
  display: flex; flex-direction: column; min-width: 0; min-height: 0;
  background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
}
.panel-head {
  flex: none; display: flex; align-items: center; gap: 8px;
  padding: 5px 10px; border-bottom: 1px solid var(--line);
}
.panel-head .name {
  font-size: 12px; font-weight: 600; letter-spacing: .02em;
  text-transform: uppercase; color: var(--ink);
}
.panel-head .gate { color: var(--faint); font-size: 11px; font-family: var(--mono); }
.panel-head .spacer { flex: 1; }
.panel-head .live {
  color: var(--live); font-size: 10px; font-weight: 600; letter-spacing: .08em;
}
.panel-frame { flex: 1; min-height: 0; position: relative; }
.panel-frame iframe {
  position: absolute; inset: 0; width: 100%; height: 100%;
  border: 0; background: var(--bg);
}

/* fit a 1920x1080 window with no scrolling; scale down gracefully on smaller windows */
@media (max-width: 1500px) { body { font-size: 13px; } .top { height: 46px; } }
</style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="wordmark">deciserv <span class="plays">plays</span></span>
      <span class="sub">six showcase games, one forward pass per move</span>
    </div>
    <div class="spacer"></div>
    <span class="chip" id="clock-chip"><span class="dot pulse"></span><span class="mono" id="clock">—</span></span>
    <span class="chip">showcase: <a href="https://github.com/0xBakeer/arbiter" target="_blank" rel="noopener">github.com/0xBakeer/arbiter</a> (MIT)</span>
  </header>

  <main class="grid" id="grid">
    <!-- panels injected by the inline script below -->
  </main>

<script>
"use strict";
/* Origin note: this page is served on :8030 while the showcase iframes are
   on :8010 — different ports mean different origins, so we cannot read scores
   out of the frames. Panels are labeled instead; each frame keeps its own live
   HUD from the showcase page itself. */
(function () {
  var GAMES = ["snake", "paddle", "hopper", "crossing", "mines", "dungeon"];
  /* Default host for the frames is 127.0.0.1 (spec). When the grid itself is
     opened from another machine (LAN, e.g. http://192.168.2.173:8030/), point
     the frames at that hostname instead — 127.0.0.1 would be the viewer's own
     machine. games/serve_showcase.py binds :8010 on all interfaces. */
  var local = location.hostname === "127.0.0.1" || location.hostname === "localhost";
  var HOST = local ? "127.0.0.1" : location.hostname;
  var BASE = "http://" + HOST + ":8010/showcase/";
  var grid = document.getElementById("grid");
  GAMES.forEach(function (g) {
    var panel = document.createElement("section");
    panel.className = "panel";
    panel.innerHTML =
      '<div class="panel-head">' +
        '<span class="name">' + g + '</span>' +
        '<span class="gate">' + HOST + ':8010</span>' +
        '<span class="spacer"></span>' +
        '<span class="live">LIVE</span>' +
      '</div>' +
      '<div class="panel-frame"><iframe src="' + BASE + g + '/" title="deciserv plays ' + g + '" loading="eager"></iframe></div>';
    grid.appendChild(panel);
  });
  var clock = document.getElementById("clock");
  function tick() {
    clock.textContent = new Date().toLocaleTimeString("en-US", { hour12: false });
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
