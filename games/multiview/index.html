<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>deciserv plays — six games, one grid</title>
<style>
/* Multiview grid tiling 0xBakeer's showcase pages (served by games/serve_showcase.py on :8010).
   Theme tokens copied from vendor/arbiter/showcase/_lib/theme.css (arbiter showcase, MIT).

   SIZING MODEL (matches the six-up video compositor, games/shoot_sixup.py):
   1920x1080 canvas, 54px header, 3x2 grid, 12px gutters.
   Each panel is EXACTLY 628x471 — the same viewport the video tiles are shot at
   (1280x800 CSS scaled by 0.4906) — and the iframe content is scaled with CSS
   transform so the whole game page (board + decision panel) fits like a video tile. */
:root {
  --bg: #0A0F1E; --surface: #0E1528; --line: #1E2842; --line-2: #2B3758; --track: #151D35;
  --ink: #E9EDF7; --muted: #8B95B3; --faint: #5E6887;
  --cobalt: #5583FF; --cobalt-text: #7DA0FF; --cobalt-dim: #2E4FA6;
  --orange: #FF8C33; --live: #3DD68C;
  --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 14px; line-height: 1.45;
  display: flex; flex-direction: column; overflow: hidden;
}

/* ---------- header row ---------- */
.top {
  flex: none; display: flex; align-items: center; gap: 14px;
  height: 52px; padding: 0 20px; border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
.wordmark { font-weight: 600; letter-spacing: -0.02em; font-size: 17px; }
.wordmark .plays { color: var(--orange); }
.sub { color: var(--muted); font-size: 13px; }
.spacer { flex: 1; }
.chip {
  display: inline-flex; align-items: center; gap: 8px;
  color: var(--muted); font-size: 12px; white-space: nowrap;
  border: 1px solid var(--line-2); border-radius: 4px; padding: 4px 10px;
}
.chip a { color: var(--cobalt-text); border: 0; }
.chip a:hover { color: var(--ink); }
.dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--live);
  box-shadow: 0 0 8px rgba(61, 214, 140, .55); flex: none;
}
.dot.pulse { animation: pulse 2s var(--ease, ease) infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }

/* ---------- 3x2 grid (video layout) ---------- */
.grid {
  flex: 1; min-height: 0;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 12px; padding: 12px;
}
.panel {
  display: flex; flex-direction: column; min-width: 0; min-height: 0;
  background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
  position: relative;
}
.panel-head {
  flex: none; display: flex; align-items: center; gap: 8px;
  padding: 4px 10px; border-bottom: 1px solid var(--line);
}
.panel-head .name {
  font-size: 11px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: var(--ink);
}
.panel-head .spacer { flex: 1; }
.panel-head .live {
  color: var(--live); font-size: 9px; font-weight: 600; letter-spacing: .08em;
}
/* The frame content is scaled to fit the cell (like the video compositor's
   LANCZOS resize): 1280x800 virtual viewport -> cell size, uniform scale. */
.panel-frame { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.panel-frame iframe {
  border: 0; background: var(--bg);
  width: 1280px; height: 800px;
  transform-origin: top left;
  position: absolute; top: 0; left: 0;
  pointer-events: auto;
}

/* fit a 1920x1080 window with no scrolling; scale down gracefully on smaller windows */
@media (max-width: 1500px) { body { font-size: 13px; } .top { height: 46px; } }
</style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="wordmark">deciserv <span class="plays">plays</span></span>
      <span class="sub">six showcase games, one forward pass per move</span>
    </div>
    <div class="spacer"></div>
    <span class="chip" id="clock-chip"><span class="dot pulse"></span><span class="mono" id="clock">—</span></span>
    <span class="chip">showcase: <a href="https://github.com/0xBakeer/arbiter" target="_blank" rel="noopener">github.com/0xBakeer/arbiter</a> (MIT)</span>
  </header>

  <main class="grid" id="grid">
    <!-- panels injected by the inline script below -->
  </main>

<script>
"use strict";
/* Each iframe renders the FULL showcase page at a fixed 1280x800 virtual viewport
   (same as the six-up video's per-tab viewport), then CSS-scales it to fill its
   cell uniformly — so panels look exactly like the video tiles, letterboxed by
   aspect fit instead of squeezed by the 380px decision column. */
(function () {
  var GAMES = ["snake", "paddle", "hopper", "crossing", "mines", "dungeon"];
  var VW = 1280, VH = 800;               /* virtual viewport per frame */
  var local = location.hostname === "127.0.0.1" || location.hostname === "localhost";
  var HOST = local ? "127.0.0.1" : location.hostname;
  var BASE = "http://" + HOST + ":8010/showcase/";
  var grid = document.getElementById("grid");

  GAMES.forEach(function (g) {
    var panel = document.createElement("section");
    panel.className = "panel";
    panel.innerHTML =
      '<div class="panel-head">' +
        '<span class="name">' + g + '</span>' +
        '<span class="spacer"></span>' +
        '<span class="live">LIVE</span>' +
      '</div>' +
      '<div class="panel-frame"><iframe src="' + BASE + g + '/" title="deciserv plays ' + g +
        '" loading="eager" tabindex="-1"></iframe></div>';
    grid.appendChild(panel);
  });

  /* uniform-scale each frame's content so the 1280x800 page fits its cell
     (contain: letterbox if the cell aspect differs; cover-crop is NOT used so
     nothing is cut). Recompute on resize. */
  function fit() {
    document.querySelectorAll(".panel-frame").forEach(function (frame) {
      var ifr = frame.querySelector("iframe");
      if (!ifr) return;
      var w = frame.clientWidth, h = frame.clientHeight;
      var s = Math.min(w / VW, h / VH);
      if (!isFinite(s) || s <= 0) return;
      ifr.style.transform = "scale(" + s + ")";
      /* center the letterboxed page inside the cell */
      var ox = (w - VW * s) / 2, oy = (h - VH * s) / 2;
      ifr.style.left = ox + "px";
      ifr.style.top = oy + "px";
    });
  }
  window.addEventListener("resize", fit);
  /* fit after layout settles and again once frames load (fonts shift sizes) */
  setTimeout(fit, 60);
  setTimeout(fit, 600);
  window.addEventListener("load", fit);

  var clock = document.getElementById("clock");
  function tick() {
    clock.textContent = new Date().toLocaleTimeString("en-US", { hour12: false });
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
